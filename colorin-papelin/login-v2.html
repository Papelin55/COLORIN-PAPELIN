<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Iniciar Sesión | Colorín Papelín</title>

<!-- Bootstrap 5 (framework requerido por el entregable de Trimestre 3) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fuentes modernas -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<!-- login.css se carga DESPUÉS de Bootstrap a propósito: así tus estilos
     personalizados (mismo nombre de clase, ej. btn-primary) siguen
     ganando en la cascada y el diseño no se rompe. -->
<link rel="stylesheet" href="login.css">
</head>

<body>

<!-- DECORACIÓN DE FONDO -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<!-- TARJETA -->
<div class="login-card container">

  <div class="icono-top">
    <i class="fas fa-palette"></i>
  </div>

  <h1>Colorín Papelín</h1>
  <p class="subtitulo">Donde el color, no tiene fin</p>

  <div class="tabs">
    <button class="active" id="tabLogin">Iniciar sesión</button>
    <button id="tabRegistro">Crear cuenta</button>
  </div>

  <div class="mensaje-error" id="mensajeError">
    Usuario o contraseña incorrectos.
  </div>

  <!-- ===== VISTA: INICIAR SESIÓN ===== -->
  <div id="vistaLogin">

    <form id="formLogin">

      <div class="campo mb-3">
        <label for="usuario">Correo electrónico</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" class="form-control" id="usuario" placeholder="tucorreo@ejemplo.com" required>
        </div>
      </div>

      <div class="campo mb-3">
        <label for="contrasena">Contraseña</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-control" id="contrasena" placeholder="••••••••" required>
        </div>
      </div>

      <div class="opciones">
        <label class="form-check">
          <input type="checkbox" class="form-check-input" id="recordar">
          Recordarme
        </label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-primary">
        Entrar <i class="fas fa-arrow-right" style="margin-left:8px;"></i>
      </button>

    </form>

    <p class="registro">
      ¿No tienes cuenta? <a href="#" id="linkRegistro">Regístrate aquí</a>
    </p>

  </div>

  <!-- ===== VISTA: CREAR CUENTA ===== -->
  <div id="vistaRegistro" style="display:none;">

    <p class="intro-registro">
      Cuéntanos un poco de ti para empezar a colorear tu mundo.
    </p>

    <form id="formRegistro">

      <div class="campo-doble">

        <div class="campo mb-3">
          <label for="nombreReg">Nombre</label>
          <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input type="text" class="form-control" id="nombreReg" placeholder="Ej. Mariana" required>
          </div>
        </div>

        <div class="campo mb-3">
          <label for="apellidoReg">Apellido</label>
          <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input type="text" class="form-control" id="apellidoReg" placeholder="Ej. Torres" required>
          </div>
        </div>

      </div>

      <div class="campo mb-3">
        <label for="correoReg">Correo electrónico</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" class="form-control" id="correoReg" placeholder="tucorreo@ejemplo.com" required>
        </div>
      </div>

      <div class="campo mb-3">
        <label for="telefonoReg">Teléfono</label>
        <div class="input-wrap">
          <i class="fas fa-phone"></i>
          <input type="tel" class="form-control" id="telefonoReg" placeholder="+57 300 000 0000" required>
        </div>
      </div>

      <div class="campo mb-3">
        <label for="direccionReg">Dirección <span class="opcional-tag">Opcional</span></label>
        <div class="input-wrap">
          <i class="fas fa-location-dot"></i>
          <input type="text" class="form-control" id="direccionReg" placeholder="Cra 5 # 12-34, Ciudad Verde, Soacha">
        </div>
      </div>

      <div class="campo mb-3">
        <label for="contrasenaReg">Contraseña</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-control" id="contrasenaReg" placeholder="Mínimo 8 caracteres" required minlength="8">
        </div>
      </div>

      <div class="campo mb-3">
        <label for="confirmarReg">Confirmar contraseña</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-control" id="confirmarReg" placeholder="Repite tu contraseña" required minlength="8">
        </div>
      </div>

      <div class="opciones opciones-registro">
        <label class="form-check">
          <input type="checkbox" class="form-check-input" id="terminosReg" required>
          Acepto los <a href="#">términos y condiciones</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary">
        Crear cuenta <i class="fas fa-arrow-right" style="margin-left:8px;"></i>
      </button>

    </form>

    <p class="registro">
      ¿Ya tienes cuenta? <a href="#" id="linkLogin">Inicia sesión aquí</a>
    </p>

  </div>

  <div class="separador">o continúa con</div>

  <div class="social-row">
    <button title="Google"><i class="fab fa-google"></i></button>
    <button title="Facebook"><i class="fab fa-facebook-f"></i></button>
  </div>

  <a href="index.html" class="volver">
    <i class="fas fa-arrow-left"></i> Volver al inicio
  </a>

</div>

<!-- Bootstrap JS (opcional, por si luego usan modales/dropdowns de Bootstrap) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="login.js"></script>

</body>
</html>
