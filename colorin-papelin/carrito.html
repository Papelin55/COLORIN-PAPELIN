<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mi carrito | Colorín Papelín</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="animacion.js" defer></script>
</head>
<body>
<div class="app-wrapper">
    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <div class="logo">Colorín Papelín</div>
            <div class="logo-sub">Arte, color & textura</div>
        </div>
        <div class="nav-menu">
            <button class="nav-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i> <span>Inicio</span></button>
            <button class="nav-item" onclick="window.location.href='productos.html'"><i class="fas fa-pencil-ruler"></i> <span>Productos</span></button>
            <button class="nav-item" onclick="window.location.href='tablero.html'"><i class="fas fa-palette"></i> <span>Tablero</span></button>
            <button class="nav-item active"><i class="fas fa-shopping-basket"></i> <span>Carrito</span></button>
            <button class="nav-item" onclick="window.location.href='pedidos.html'"><i class="fas fa-box-open"></i> <span>Mis pedidos</span></button>
        </div>
    </aside>

    <button class="toggle-sidebar-btn" id="toggleSidebarBtn"><i class="fas fa-bars" id="toggleIcon"></i></button>

    <main class="main-content" id="mainContent">
        <div class="top-bar">
            <div class="page-title">Mi carrito de compras</div>
            <div class="top-bar-actions">
                <a class="login-link" id="volverPanelLink" href="#" style="display:none;"></a>
                <a class="login-link" data-auth href="login-v2.html"><i class="fas fa-user"></i> Iniciar sesión</a>
            </div>
        </div>

        <div class="featured-section" style="margin-bottom:0;">
            <div class="section-header"><h3>🧺 Tu carrito</h3></div>
        </div>

        <div class="cart-layout" id="cartLayout">
            <!-- se llena por JS -->
        </div>

        <footer>🌈 Colorín Papelín · Soacha, Colombia · 2026</footer>
    </main>
</div>

<script src="carrito.js"></script>
</body>
</html>
